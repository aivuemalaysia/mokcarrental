name: SEO v2 Release 1 read-only QA

on:
  push:
    branches:
      - cto/seo-v2-release1-preview-20261105
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-v2-release1-qa
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install locked dependencies, without postinstall scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Exact requested TypeScript check
        run: npx tsc --noEmit

      - name: Full Jest suite
        run: pnpm exec jest --runInBand
